<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Estimate requests | Perinton Paving</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f3ee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1b1d1f}
header{background:#fff;border-bottom:1px solid #e2ddd4;position:sticky;top:0;z-index:5}
.in{width:min(1100px,100% - 32px);margin:auto}
header .in{display:flex;align-items:center;gap:16px;height:64px}
header img{height:36px}
header h1{font-size:1rem;margin:0;color:#5d625f;font-weight:600}
header button{margin-left:auto;background:none;border:1.5px solid #cfcac1;border-radius:6px;padding:.5rem .9rem;font-weight:700;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
.bar button{border:1.5px solid #cfcac1;background:#fff;border-radius:999px;padding:.45rem .9rem;font-weight:700;cursor:pointer;font-size:.88rem}
.bar button.on{background:#005a48;border-color:#005a48;color:#fff}
.bar button b{opacity:.7;font-weight:600;margin-left:4px}
.empty{text-align:center;color:#5d625f;padding:60px 0}
.card{background:#fff;border:1px solid #e2ddd4;border-left:5px solid #ff4e00;border-radius:8px;padding:18px 20px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:10px 20px}
.card[data-status="contacted"],.card[data-status="estimate scheduled"],.card[data-status="quoted"]{border-left-color:#e0a800}
.card[data-status="won"]{border-left-color:#005a48}
.card[data-status="lost"]{border-left-color:#9aa09d;opacity:.8}
.name{font-weight:800;font-size:1.1rem}
.meta{color:#5d625f;font-size:.88rem;margin-top:2px}
.contact{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-weight:600}
.contact a{color:#005a48}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{background:#f0ede7;border-radius:4px;padding:.2rem .55rem;font-size:.82rem;font-weight:600}
.msgtxt{margin-top:10px;white-space:pre-wrap;font-size:.95rem}
.side{display:grid;gap:8px;align-content:start;min-width:190px}
select,textarea{font:inherit;padding:.5rem;border:1.5px solid #cfcac1;border-radius:6px;width:100%}
textarea{font-size:.88rem;min-height:60px;resize:vertical}
.del{background:none;border:1.5px solid #e3b4ad;color:#c0392b;border-radius:6px;padding:.45rem;font-weight:700;cursor:pointer}
.del:hover{background:#c0392b;color:#fff;border-color:#c0392b}
.saved{font-size:.78rem;color:#005a48;min-height:1em}
.tier{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .55rem;border-radius:4px;margin-left:8px;vertical-align:middle}
.tier.priority{background:#ff4e00;color:#fff}.tier.standard{background:#005a48;color:#fff}.tier.low{background:#e4e1da;color:#5d625f}
.card.low{opacity:.75}
.why{font-size:.85rem;color:#005a48;font-weight:600;margin-top:4px}
.tags span.flag{background:#fde8e4;color:#b03a22}
.bar.tiers button.on{background:#ff4e00;border-color:#ff4e00}
@media(max-width:700px){.card{grid-template-columns:1fr}.side{min-width:0}}
</style>
</head>
<body>
<header><div class="in">
  <img src="/img/logo.jpg" alt="Perinton Paving, Inc.">
  <h1>Estimate requests</h1>
  <button id="out">Sign out</button>
</div></header>
<main class="in">
  <div class="bar tiers" id="tiers"></div>
  <div class="bar" id="bar" style="margin-top:-10px"></div>
  <div id="list"></div>
</main>
<script>
let all = [], statuses = [], filter = 'all', tierF = 'all';
const TIERS = { priority: 'Priority', standard: 'Close to Fairport', low: 'Small + far' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when = s => new Date(s.replace(' ', 'T') + 'Z').toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });

async function load() {
  const r = await fetch('/admin/api/quotes');
  if (r.status === 401) return location.reload();
  const d = await r.json();
  all = d.quotes; statuses = d.statuses;
  render();
}
function render() {
  const counts = { all: all.length };
  statuses.forEach(s => counts[s] = all.filter(q => q.status === s).length);
  document.getElementById('bar').innerHTML = ['all', ...statuses].map(s =>
    `<button class="${s === filter ? 'on' : ''}" data-f="${esc(s)}">${s === 'all' ? 'All' : esc(s[0].toUpperCase() + s.slice(1))}<b>${counts[s]}</b></button>`).join('');
  const tc = { all: all.length }; Object.keys(TIERS).forEach(t => tc[t] = all.filter(q => (q.tier || 'standard') === t).length);
  document.getElementById('tiers').innerHTML = ['all', ...Object.keys(TIERS)].map(t =>
    `<button class="${t === tierF ? 'on' : ''}" data-t="${t}">${t === 'all' ? 'All jobs' : TIERS[t]}<b>${tc[t]}</b></button>`).join('');
  const rows = all.filter(q => (filter === 'all' || q.status === filter) && (tierF === 'all' || (q.tier || 'standard') === tierF));
  const list = document.getElementById('list');
  if (!rows.length) { list.innerHTML = '<p class="empty">No requests here yet.</p>'; return; }
  list.innerHTML = rows.map(q => `
    <div class="card ${esc(q.tier || '')}" data-id="${q.id}" data-status="${esc(q.status)}">
      <div>
        <div class="name">${esc(q.name)}${q.tier ? `<span class="tier ${esc(q.tier)}">${TIERS[q.tier] || ''}</span>` : ''}</div>
        <div class="meta">${when(q.created_at)}${q.town ? ' · ' + esc(q.town) : ''}</div>
        ${q.reasons ? `<div class="why">${esc(q.reasons)}</div>` : ''}
        <div class="contact">
          <a href="tel:${esc(q.phone.replace(/[^\d+]/g, ''))}">${esc(q.phone)}</a>
          ${q.email ? `<a href="mailto:${esc(q.email)}">${esc(q.email)}</a>` : ''}
          ${q.address ? `<a target="_blank" rel="noopener" href="https://maps.google.com/?q=${encodeURIComponent(q.address + ' ' + (q.town || ''))}">${esc(q.address)}</a>` : ''}
        </div>
        <div class="tags">
          ${(q.flags || '').split(', ').filter(Boolean).map(f => `<span class="flag">${esc(f)}</span>`).join('')}
          ${[q.client_type, q.service, q.size, q.grade && ('Slope: ' + q.grade), q.access, q.surface && ('Now: ' + q.surface), q.budget && ('Budget: ' + q.budget), q.timing].filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('')}
        </div>
        ${q.message ? `<div class="msgtxt">${esc(q.message)}</div>` : ''}
      </div>
      <div class="side">
        <select data-act="status">${statuses.map(s => `<option ${s === q.status ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
        <textarea data-act="notes" placeholder="Private notes">${esc(q.notes || '')}</textarea>
        <span class="saved"></span>
        <button class="del" data-act="delete">Delete</button>
      </div>
    </div>`).join('');
}
async function patch(id, body, card) {
  const r = await fetch('/admin/api/quotes/' + id, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (r.status === 401) return location.reload();
  const s = card.querySelector('.saved'); s.textContent = r.ok ? 'Saved' : 'Save failed';
  setTimeout(() => s.textContent = '', 1500);
}
document.getElementById('tiers').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tierF = b.dataset.t; render();
});
document.getElementById('bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f; render();
});
document.getElementById('list').addEventListener('change', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id, q = all.find(x => x.id == id);
  if (e.target.dataset.act === 'status') { q.status = e.target.value; card.dataset.status = q.status; patch(id, { status: q.status }, card); }
  if (e.target.dataset.act === 'notes') { q.notes = e.target.value; patch(id, { notes: q.notes }, card); }
});
document.getElementById('list').addEventListener('click', async e => {
  if (e.target.dataset.act !== 'delete') return;
  const card = e.target.closest('.card');
  if (!confirm('Delete this request? This can\'t be undone.')) return;
  const r = await fetch('/admin/api/quotes/' + card.dataset.id, { method: 'DELETE' });
  if (r.status === 401) return location.reload();
  if (r.ok) { all = all.filter(q => q.id != card.dataset.id); render(); }
});
document.getElementById('out').addEventListener('click', async () => {
  await fetch('/admin/logout', { method: 'POST' }); location.reload();
});
load();
</script>
</body>
</html>
