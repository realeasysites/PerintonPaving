<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin sign in | Perinton Paving</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#005a48;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
.card{background:#fff;border-radius:10px;padding:32px;width:min(380px,100%);box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
img{width:100%;max-width:260px;display:block;margin:0 auto 20px}
h1{font-size:1.1rem;text-align:center;margin:0 0 18px;color:#1b1d1f}
label{display:grid;gap:6px;font-weight:700;font-size:.9rem}
input{font:inherit;padding:.8rem;border:1.5px solid #cfcac1;border-radius:6px}
input:focus{outline:none;border-color:#005a48;box-shadow:0 0 0 3px rgba(0,90,72,.15)}
button{margin-top:14px;width:100%;padding:.9rem;border:0;border-radius:6px;background:#ff4e00;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
button:disabled{opacity:.6}
.msg{color:#c0392b;font-weight:600;min-height:1.2em;margin:12px 0 0;text-align:center;font-size:.92rem}
</style>
</head>
<body>
<form class="card" id="f">
  <img src="/img/logo.jpg" alt="Perinton Paving, Inc.">
  <h1>Estimate requests</h1>
  <label>Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
  <button type="submit">Sign in</button>
  <p class="msg" id="msg"></p>
</form>
<script>
fetch('/admin/status').then(r => r.json()).then(s => {
  if (!s.configured) {
    document.getElementById('msg').textContent = 'Admin login is not set up yet.';
    document.querySelector('button').disabled = true;
  }
});
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  const r = await fetch('/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: e.target.password.value })
  });
  const d = await r.json().catch(() => ({}));
  if (d.ok) location.reload(); else msg.textContent = d.error || 'Sign in failed.';
});
</script>
</body>
</html>
